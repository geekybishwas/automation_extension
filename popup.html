<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyncGTM - LinkedIn Automation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
        width: 550px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #ffffff;
        border: 1px solid #ddd;
        /* color: #333; */
    }


    .header {
      display: flex;
      align-items: center;
      padding: 8px;
      background: linear-gradient(135deg, #7e22ce 0%, #004182 100%);
      color: white;
      border-bottom: 2px solid #7e22ce;
    }

    .logo {
      width: 30px;
      height: 30px;
      margin-right: 12px;
      border-radius: 8px;
      background: white;
      padding: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .header-text {
      flex: 1;
    }

    .header-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header-subtitle {
      font-size: 10px;
      opacity: 0.9;
      margin-top: 2px;
    }

    .content {
     padding: 14px;
    }


    .description {
      font-size: 13px;
      line-height: 1.4;
      color: #555;
      margin-bottom: 10px;
    }

    .description strong {
      color: #7e22ce;
      font-weight: 550;
    }

    .learn-more {
      display: inline-block;
      /* color: #7e22ce; */
      color: #0a66c2;

      text-decoration: none;
      font-weight: 550;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
    }

    .learn-more:hover {
      border-bottom-color: #0a66c2;
    }

    .status-section {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }

    .status-row:not(:last-child) {
      border-bottom: 1px solid #e0e0e0;
    }

    .status-label {
      font-size: 13px;
      color: #666;
    }

    .status-value {
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }

    .status-badge.active {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .status-badge.inactive {
      background: #ffebee;
      color: #c62828;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      color: white;
    }

    .btn-primary {
      background: linear-gradient(135deg, #7e22ce 0%, #004182 100%);

    }

    .btn-primary:hover {
      background: #004182;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(10, 102, 194, 0.3);
    }

    .btn-secondary {
      background: white;
      color: #0a66c2;
      border: 2px solid #0a66c2;
    }

    .btn-secondary:hover {
      background: #f0f7ff;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .footer {
      padding: 10px 16px;
      background: #f8f9fa;
      border-top: 1px solid #e0e0e0;
      text-align: center;
    }

    .footer-text {
      font-size: 11px;
      color: #999;
    }

    .footer-link {
      color: #0a66c2;
      text-decoration: none;
      font-weight: 600;
    }

    .footer-link:hover {
      text-decoration: underline;
    }

    .indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .indicator.green {
      background: #4caf50;
      box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.2);
    }

    .indicator.red {
      background: #f44336;
      box-shadow: 0 0 0 2px rgba(244, 67, 54, 0.2);
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <img src="icons/128.png" alt="SyncGTM Logo" class="logo">
    <div class="header-text">
      <div class="header-title">SyncGTM</div>
      <div class="header-subtitle">LinkedIn Automation</div>
    </div>
  </div>

  <!-- Content -->
  <div class="content">
    <!-- Description -->
    <div class="description">
      Use <strong>SyncGTM</strong> extension to automate LinkedIn actions in your current browser. 
      <a href="https://app.reasonyx.com/help" target="_blank" class="learn-more">Learn more</a>
    </div>

    <!-- Status Section -->
    <div class="status-section">
      <div class="status-row">
        <span class="status-label">Extension Status</span>
        <span class="status-value">
          <span class="indicator green" id="statusIndicator"></span>
          <span id="statusText">Active</span>
        </span>
      </div>
      <div class="status-row">
        <span class="status-label">Version</span>
        <span class="status-value" id="versionText">1.0.1</span>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
    <!-- <a href="https://syncgtm.com/" class="btn btn-primary"  target="_blank" id="openDashboard">
      <span>📊</span>
      <span>Open Dashboard</span>
    </a> -->
      <!-- <button class="btn btn-secondary" id="testConnection">
        <span>🔌</span>
        <span>Test Connection</span>
      </button> -->
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-text">
      Need help? <a href="https://syncgtm.com/book-demo/" target="_blank" class="footer-link">Contact Support</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
